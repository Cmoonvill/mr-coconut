<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mr. Coconut - Master Edition</title>
    
    <link rel="manifest" href="https://Cmoonvill.github.io/mr-coconut/manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mr. Coconut">
    
    <link rel="apple-touch-icon" href="https://Cmoonvill.github.io/mr-coconut/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://Cmoonvill.github.io/mr-coconut/icon-192.png">

    <style>
        :root { --accent: #2ecc71; --ui-glass: rgba(255, 255, 255, 0.15); --modal-bg: rgba(15, 15, 15, 0.98); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }

        /* Immersive Background */
        #bg-blur { position: fixed; inset: -10%; background-size: cover; background-position: center; filter: blur(80px) brightness(0.35); transition: background-image 1.5s ease; z-index: 1; pointer-events: none; }

        /* Splash Screen */
        #splash { position: fixed; inset: 0; background: #fff; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1.2s ease; }
        #start-btn { padding: 22px 55px; font-size: 24px; font-weight: 600; color: white; background: #ff7043; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 15px 35px rgba(255,112,67,0.3); transition: 0.3s; }

        /* Tablet Stage */
        #stage { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; z-index: 10; perspective: 3000px; }
        #book-frame { 
            position: relative; width: 94%; height: 88%; max-width: 1500px;
            background: #fff; border-radius: 4px; box-shadow: 0 60px 120px rgba(0,0,0,0.7);
            overflow: hidden; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.15, 1, 0.3, 1);
        }

        /* Paper Grain Overlay */
        #book-frame::after {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            opacity: 0.12; mix-blend-mode: multiply; z-index: 5;
        }

        #content-layer { width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: center; }

        /* Shake Animation for "Thump" */
        .impact-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* iPad Style UI */
        #nav-drawer { position: fixed; bottom: -180px; left: 0; width: 100%; height: 150px; background: rgba(0,0,0,0.85); backdrop-filter: blur(30px); z-index: 1000; transition: bottom 0.5s cubic-bezier(0.19, 1, 0.22, 1); display: flex; align-items: center; gap: 20px; padding: 0 30px; overflow-x: auto; border-top: 1px solid rgba(255,255,255,0.1); }
        #nav-drawer.open { bottom: 0; }
        .thumb { min-width: 100px; height: 120px; border-radius: 10px; background-size: cover; background-position: center; cursor: pointer; opacity: 0.4; transition: 0.4s; border: 3px solid transparent; }
        .thumb.active { opacity: 1; border-color: var(--accent); transform: scale(1.08); }

        .tap-zone { position: absolute; top: 0; height: 100%; width: 25%; z-index: 100; cursor: pointer; }
        #tap-left { left: 0; }
        #tap-right { right: 0; }

        .floating-ui { position: absolute; bottom: 30px; z-index: 1100; background: var(--ui-glass); color: white; padding: 14px 28px; border-radius: 35px; cursor: pointer; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2); font-size: 15px; font-weight: 600; transition: 0.3s; }
        #menu-btn { right: 30px; }
        #print-btn { left: 30px; }
        #fullscreen-btn { bottom: auto; top: 30px; left: 30px; padding: 10px; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; }

        #print-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 340px; background: var(--modal-bg); backdrop-filter: blur(25px); border-radius: 24px; padding: 30px; color: white; z-index: 3000; opacity: 0; pointer-events: none; transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1); box-shadow: 0 40px 80px rgba(0,0,0,0.9); }
        #print-modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

        .ken-burns { animation: kenburns 30s ease-in-out infinite alternate; }
        @keyframes kenburns { 0% { transform: scale(1); } 100% { transform: scale(1.07); } }

        @media print {
            @page { size: landscape; margin: 0; }
            body { background: white !important; }
            #stage, #bg-blur, #nav-drawer, #splash, .floating-ui, .tap-zone, #print-modal { display: none !important; }
            .print-container { display: block !important; }
            .print-page { page-break-after: always; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
            .print-page img { max-width: 100%; max-height: 100%; object-fit: contain; }
        }
        .print-container { display: none; }
    </style>
</head>
<body>

    <div id="print-ensemble" class="print-container"></div>

    <div id="splash">
        <h1 style="color: #2c3e50; font-size: 56px; margin-bottom: 10px;">Mr. Coconut</h1>
        <p style="color: #95a5a6; font-size: 19px; margin-bottom: 45px;">Master Studio Edition • 2026</p>
        <button id="start-btn">Begin Story</button>
    </div>

    <div id="bg-blur"></div>
    <div id="fullscreen-btn" class="floating-ui" title="Fullscreen Mode">⛶</div>
    <div id="print-btn" class="floating-ui">🖨️ Print Studio</div>
    <div id="menu-btn" class="floating-ui">☰ View Pages</div>

    <div id="print-modal">
        <h2 style="margin-top:0">Print Studio</h2>
        <label style="display:flex; align-items:center; gap:15px; margin-bottom:20px; cursor:pointer;">
            <input type="checkbox" id="print-all-check" checked style="width:22px; height:22px;">
            <span>Print Entire Ensemble</span>
        </label>
        <button id="do-print" style="width:100%; padding:15px; background:var(--accent); color:white; border:none; border-radius:14px; font-weight:bold; cursor:pointer;">Generate Print File</button>
        <button id="cancel-print" style="width:100%; padding:12px; background:transparent; color:#999; border:none; cursor:pointer; margin-top:10px;">Dismiss</button>
    </div>

    <div id="nav-drawer"></div>

    <div id="stage">
        <div id="tap-left" class="tap-zone"></div>
        <div id="tap-right" class="tap-zone"></div>
        <div id="book-frame">
            <div id="content-layer" class="ken-burns"></div>
        </div>
    </div>

    <audio id="ambient-loop" loop src="ocean.mp3"></audio>
    <audio id="flip-sfx" src="flip.mp3"></audio>
    <audio id="event-sfx"></audio>

    <script>
        const bookData = [
            { file: "Cover.jpg", audio: "page0.mp3", text: `Mr. Coconut. By Alejandro A. Luna. Illustrated by Dad.` },
            { file: "2-3.jpg", audio: "page1.mp3", text: `In the middle of the big, blue ocean, on a teeny, tiny island, lived Mr. Coconut. His home was the tallest, curviest palm tree right on the edge of the sand.` },
            { file: "4-5.jpg", audio: "page2.mp3", text: `Mr. Coconut's favorite thing in the whole world was sitting on the top branch. From up there, he could see the whales spouting and the clouds changing shape. He dreamed of sailing away on big adventures.`, sfx: 'whale.mp3' },
            { file: "6-7.jpg", audio: "page3.mp3", text: `But one day, the wind didn't whisper. It HOWLED. The palm tree swung left. Then RIGHT.`, sfx: 'wind.mp3' },
            { file: "8-9.jpg", audio: "page4.mp3", text: `WHOOOOOSH! Mr. Coconut lost his grip. BUMP! BUMP! THUMP! He landed upside down in the sand. "Oh, phooey," he sighed.`, sfx: 'thump.mp3', shake: true },
            { file: "10-11.jpg", audio: "page5.mp3", text: `Mr. Coconut tried to climb the trunk. He took one step up. Sliiiide. Back down he went. The tree was too tall. The trunk was too slippery. He missed his view.` },
            { file: "12-13.jpg", audio: "page6.mp3", text: `Just as a tear was forming in his eye, click-clack-click-clack. Out from a tide pool scuttled Ms. Kind-Crab. She was wearing a little piece of sea glass on her back like a backpack.`, sfx: 'crab.mp3' },
            { file: "14-15.jpg", audio: "page7.mp3", text: `"Why the long face, Mr. Nut?" she asked. (She always got his name wrong). "I've fallen and I can't get back up," said Mr. Coconut. Ms. Kind-Crab snapped her claws. "I have an idea!"` },
            { file: "16-17.jpg", audio: "page8.mp3", text: `Pinch. Ms. Kind-Crab grabbed a frond. Scuttle. She climbed up the tree sideways. Snip. She cut a long, strong vine.` },
            { file: "18-19.jpg", audio: "page9.mp3", text: `She tied one end of the vine around Mr. Coconut's middle. She threw the other end over the highest branch. "Pull!" she shouted. Mr. Coconut pulled. Ms. Crab pulled. Slowly... slowly...` },
            { file: "20-21.jpg", audio: "page10.mp3", text: `PLOP! Mr. Coconut landed right back on his favorite spot. The sea was still there. The sky was still there. But something felt different. Better.`, sfx: 'sparkle.mp3' },
            { file: "22-23.jpg", audio: "page11.mp3", text: `Oh my," whispered Ms. Kind-Crab. "I've never seen the ocean from up here. It's... it's so big." Mr. Coconut smiled. "Would you like to stay and watch it with me?"` },
            { file: "24-25.jpg", audio: "page12.mp3", text: `And so they sat. Mr. Coconut didn't just dream of adventures anymore. He dreamed of adventures with a friend. And that, he realized, was the very best kind of dream.` },
            { file: "Back Cover.jpg", audio: "page13.mp3", text: `Sometimes you need a little help from a friend to get back to where you belong. The End. Thank you for reading Mr. Coconut! SHARP Moon Studio 2026` }
        ];

        let currentIndex = 0;
        const stage = document.getElementById('content-layer');
        const bg = document.getElementById('bg-blur');
        const frame = document.getElementById('book-frame');
        const drawer = document.getElementById('nav-drawer');
        const eventSfx = document.getElementById('event-sfx');
        let narrationAudio = null;

        // Build Nav & Print Ensemble
        const pSet = document.getElementById('print-ensemble');
        bookData.forEach((page, idx) => {
            const thumb = document.createElement('div');
            thumb.className = 'thumb'; thumb.style.backgroundImage = `url('${page.file}')`;
            thumb.onclick = (e) => { e.stopPropagation(); jumpToPage(idx); };
            drawer.appendChild(thumb);
            const pPg = document.createElement('div');
            pPg.className = 'print-page'; pPg.innerHTML = `<img src="${page.file}">`;
            pSet.appendChild(pPg);
        });

        const startAction = () => {
    document.getElementById('splash').style.opacity = '0';
    setTimeout(() => document.getElementById('splash').style.display = 'none', 1200);

    const ocean = document.getElementById('ambient-loop');
    ocean.play();
    // Re-assert volume IMMEDIATELY after play for iOS
    ocean.volume = 0.1; 
    
    renderPage();
        };

        document.getElementById('start-btn').addEventListener('click', startAction);
        document.getElementById('start-btn').addEventListener('touchstart', startAction);

        function renderPage(dir) {
            if(dir === 'next') frame.style.transform = 'rotateY(-15deg) scale(0.96) translateX(-30px)';
            if(dir === 'prev') frame.style.transform = 'rotateY(15deg) scale(0.96) translateX(30px)';
            
            document.getElementById('flip-sfx').play();
            if (narrationAudio) { narrationAudio.pause(); narrationAudio.currentTime = 0; }
            eventSfx.pause();

            setTimeout(() => {
                const data = bookData[currentIndex];
                stage.style.backgroundImage = `url('${data.file}')`;
                bg.style.backgroundImage = `url('${data.file}')`;
                frame.style.transform = 'rotateY(0deg) scale(1) translateX(0px)';
                
                if(data.shake) {
                    frame.classList.add('impact-shake');
                    setTimeout(() => frame.classList.remove('impact-shake'), 500);
                }

                document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === currentIndex));

                if(data.sfx) {
            eventSfx.src = data.sfx;
            eventSfx.play();
            // Force the volume again for the iPad
            eventSfx.volume = 0.1;
                }

                speak();
            }, 300);
        }

        function jumpToPage(idx) { currentIndex = idx; renderPage(); drawer.classList.remove('open'); }

        function speak() {
            const data = bookData[currentIndex];
            if (data.audio) {
                narrationAudio = new Audio(data.audio);
                narrationAudio.volume = 1.0;
                setTimeout(() => {
                    narrationAudio.play().catch(e => console.log("Audio waiting for user click."));
                }, 600);
            }
        }

        // Interactivity
        document.getElementById('tap-right').addEventListener('click', () => { if (currentIndex < bookData.length - 1) { currentIndex++; renderPage('next'); } });
        document.getElementById('tap-left').addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderPage('prev'); } });
        document.getElementById('menu-btn').addEventListener('click', () => drawer.classList.toggle('open'));
        document.getElementById('print-btn').addEventListener('click', () => document.getElementById('print-modal').classList.add('show'));
        document.getElementById('cancel-print').addEventListener('click', () => document.getElementById('print-modal').classList.remove('show'));
        document.getElementById('do-print').addEventListener('click', () => {
            const printAll = document.getElementById('print-all-check').checked;
            document.querySelectorAll('.print-page').forEach((pg, i) => pg.style.display = (printAll || i === currentIndex) ? 'flex' : 'none');
            window.print();
        });

        // Fullscreen Support
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') document.getElementById('tap-right').click();
            if (e.key === 'ArrowLeft') document.getElementById('tap-left').click();
            if (e.key === 'Escape') { 
                drawer.classList.remove('open'); 
                document.getElementById('print-modal').classList.remove('show'); 
            }
            if (e.key === 'f' || e.key === 'F') document.getElementById('fullscreen-btn').click();
        });
    </script>
</body>
</html>
